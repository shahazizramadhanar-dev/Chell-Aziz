<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf1df"/>
      <stop offset="1" stop-color="#ead8b8"/>
    </linearGradient>
    <linearGradient id="flap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset="1" stop-color="#e6d2ae"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e3cfa9"/>
      <stop offset="1" stop-color="#f6e8cd"/>
    </linearGradient>
    <radialGradient id="wax" cx="38%" cy="32%" r="75%">
      <stop offset="0" stop-color="#b8334b"/>
      <stop offset="0.6" stop-color="#7d1624"/>
      <stop offset="1" stop-color="#4a0912"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6e3bd"/>
      <stop offset="1" stop-color="#b98f52"/>
    </linearGradient>
  </defs>

  <!-- shadow -->
  <ellipse cx="200" cy="262" rx="160" ry="10" fill="#28000840"/>

  <!-- back / body -->
  <rect x="20" y="40" width="360" height="210" rx="6" fill="url(#body)" stroke="#c8aa7b" stroke-opacity="0.7"/>

  <!-- inner card peeking out -->
  <rect x="48" y="26" width="304" height="170" rx="3" fill="#fffdf8" stroke="#c8aa7b" stroke-opacity="0.5"/>
  <g stroke="#c8aa7b" stroke-opacity="0.5" fill="none">
    <rect x="58" y="36" width="284" height="150" rx="2"/>
  </g>
  <text x="200" y="80" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="15" fill="#8a7152" letter-spacing="3">THE WEDDING OF</text>
  <text x="200" y="118" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="30" fill="#5c101c">Michael &amp; Anastasia</text>
  <text x="200" y="150" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#8a7152" letter-spacing="5">01 · 12 · 2026</text>

  <!-- side folds -->
  <path d="M20 40 L20 250 L212 150 Z" fill="url(#side)" stroke="#c8aa7b" stroke-opacity="0.45"/>
  <path d="M380 40 L380 250 L188 150 Z" fill="url(#side)" stroke="#c8aa7b" stroke-opacity="0.45"/>

  <!-- bottom fold -->
  <path d="M20 250 L200 128 L380 250 Z" fill="url(#body)" stroke="#c8aa7b" stroke-opacity="0.6"/>

  <!-- top flap -->
  <path d="M20 40 L200 168 L380 40 Z" fill="url(#flap)" stroke="#c8aa7b" stroke-opacity="0.7"/>
  <path d="M34 46 L200 160 L366 46" fill="none" stroke="url(#gold)" stroke-opacity="0.65" stroke-width="1.2"/>

  <!-- wax seal -->
  <g transform="translate(200 168)">
    <circle r="31" fill="#28000833" cx="2" cy="4"/>
    <path d="M0 -30 C 14 -34, 28 -22, 30 -6 C 34 8, 24 26, 8 30 C -8 36, -28 26, -30 8 C -36 -8, -24 -26, 0 -30 Z" fill="url(#wax)"/>
    <circle r="21" fill="none" stroke="url(#gold)" stroke-width="1.2" opacity="0.85"/>
    <text y="6" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="17" fill="url(#gold)">M&amp;A</text>
    <path d="M-14 -12 C -8 -20, 4 -22, 12 -16" fill="none" stroke="#e58a9c" stroke-opacity="0.45" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
